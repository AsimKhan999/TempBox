services:
  postgres:
    image: postgres:16-alpine
    container_name: tempbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tempbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tempbox-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: asimkhan2005/tempbox-backend
    container_name: tempbox-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tempbox
      REDIS_URL: redis://redis:6379
      MAIL_DOMAIN: tempbox.com
      MAILBOX_TTL_MINUTES: 20
      JWT_SECRET: ${JWT_SECRET:-tempbox-production-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  smtp:
    image: asimkhan2005/tempbox-smtp
    container_name: tempbox-smtp
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      NODE_ENV: production
      SMTP_PORT: 25
      BACKEND_URL: http://backend:5000
      MAIL_DOMAIN: tempbox.com
    depends_on:
      - backend

  frontend:
    image: asimkhan2005/tempbox-frontend
    container_name: tempbox-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
